[pytest]
# ── Test discovery ──────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# ── Markers ─────────────────────────────────────────────────────────────────
markers =
    asyncio: marks tests as async (use pytest-asyncio)
    integration: marks full integration tests
    unit: marks pure unit tests (no I/O)

# ── Async mode ──────────────────────────────────────────────────────────────
asyncio_mode = auto

# ── Output ──────────────────────────────────────────────────────────────────
# -v   verbose output (one line per test)
# -s   show stdout/print statements
# --tb=short   short tracebacks for cleaner output
addopts = -v --tb=short --strict-markers

# ── Log capturing ────────────────────────────────────────────────────────────
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_date_format = %H:%M:%S

# ── Coverage (activate with --cov flag) ─────────────────────────────────────
# Run with: pytest --cov=backend/app --cov=timeline_service/app --cov-report=html
