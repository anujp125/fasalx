<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FasalX Admin Dashboard Controls</title>
    <style>
      :root {
        color-scheme: light;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f7f3;
        color: #172118;
      }
      body {
        margin: 0;
      }
      main {
        max-width: 880px;
        margin: 0 auto;
        padding: 32px 20px;
      }
      header {
        margin-bottom: 24px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 28px;
        letter-spacing: 0;
      }
      p {
        margin: 0;
        color: #5b665c;
      }
      .panel {
        background: #fff;
        border: 1px solid #dfe8dc;
        border-radius: 8px;
        padding: 20px;
        box-shadow: 0 8px 24px rgba(23, 33, 24, 0.06);
      }
      label {
        display: block;
        font-weight: 700;
        margin-bottom: 8px;
      }
      input[type="text"] {
        width: 100%;
        box-sizing: border-box;
        border: 1px solid #cdd8ca;
        border-radius: 6px;
        padding: 12px;
        font: inherit;
      }
      .actions {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin: 16px 0 24px;
      }
      button {
        border: 0;
        border-radius: 6px;
        padding: 10px 14px;
        font: inherit;
        font-weight: 700;
        color: #fff;
        background: #2f7d32;
        cursor: pointer;
      }
      button.secondary {
        background: #56615a;
      }
      .toggles {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 12px;
      }
      .toggle {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border: 1px solid #e1e8df;
        border-radius: 8px;
        padding: 14px 16px;
      }
      .toggle span {
        font-weight: 700;
      }
      .toggle small {
        display: block;
        margin-top: 2px;
        color: #6a746b;
        font-weight: 500;
      }
      input[type="checkbox"] {
        inline-size: 42px;
        block-size: 24px;
        accent-color: #2f7d32;
      }
      #status {
        min-height: 22px;
        margin-top: 16px;
        color: #415044;
        font-weight: 700;
      }
      #status.error {
        color: #b42318;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <h1>Dashboard Component Visibility</h1>
        <p>Toggle which modules appear on the farmer dashboard.</p>
      </header>

      <section class="panel">
        <label for="apiBase">API base URL</label>
        <input id="apiBase" type="text" value="http://localhost:8000/api/v1" />

        <div style="height: 16px"></div>

        <label for="token">Firebase admin ID token</label>
        <input id="token" type="text" placeholder="Paste admin token with dashboard:manage permission" />

        <div class="actions">
          <button id="load">Load Current Config</button>
          <button id="save" class="secondary">Save All Toggles</button>
        </div>

        <div id="toggles" class="toggles"></div>
        <div id="status"></div>
      </section>
    </main>

    <script>
      const labels = {
        weather: ["Weather", "Greeting and forecast card"],
        mandi_prices: ["Crop Pricing", "Mandi and NCDEX market prices"],
        iot_data: ["IoT Data", "Sensor snapshot and sync action"],
        expense_ledger: ["Expense Ledger", "Farm cost tracking module"],
        timeline: ["Timeline", "Crop journey, GDD, and milestones"],
        recommendation: ["Recommendations", "Crop recommendation entry point"],
        chatbot_button: ["Chatbot Button", "Assistant shortcut"],
      };

      let components = {
        weather: true,
        mandi_prices: true,
        iot_data: true,
        expense_ledger: true,
        timeline: true,
        recommendation: true,
        chatbot_button: true,
      };

      const toggles = document.getElementById("toggles");
      const statusEl = document.getElementById("status");

      function setStatus(message, isError = false) {
        statusEl.textContent = message;
        statusEl.className = isError ? "error" : "";
      }

      function render() {
        toggles.innerHTML = "";
        Object.entries(components).forEach(([key, value]) => {
          const [title, hint] = labels[key] || [key, ""];
          const row = document.createElement("label");
          row.className = "toggle";
          row.innerHTML = `
            <span>${title}<small>${hint}</small></span>
            <input type="checkbox" data-key="${key}" ${value ? "checked" : ""} />
          `;
          toggles.appendChild(row);
        });
      }

      async function request(path, options = {}) {
        const base = document.getElementById("apiBase").value.replace(/\/$/, "");
        const token = document.getElementById("token").value.trim();
        const headers = { "Content-Type": "application/json", ...(options.headers || {}) };
        if (token) headers.Authorization = `Bearer ${token}`;
        const response = await fetch(`${base}${path}`, { ...options, headers });
        const body = await response.json();
        if (!response.ok) throw new Error(body.detail || body.error?.message || "Request failed");
        return body;
      }

      toggles.addEventListener("change", async (event) => {
        const input = event.target;
        if (!(input instanceof HTMLInputElement)) return;
        const key = input.dataset.key;
        const visible = input.checked;
        try {
          const body = await request("/admin/dashboard/visibility/toggle", {
            method: "PATCH",
            body: JSON.stringify({ component: key, visible }),
          });
          components = body.config.components;
          render();
          setStatus(body.message);
        } catch (error) {
          input.checked = !visible;
          setStatus(error.message, true);
        }
      });

      document.getElementById("load").addEventListener("click", async () => {
        try {
          const body = await request("/admin/dashboard/visibility");
          components = body.components;
          render();
          setStatus("Loaded current dashboard visibility.");
        } catch (error) {
          setStatus(error.message, true);
        }
      });

      document.getElementById("save").addEventListener("click", async () => {
        try {
          const body = await request("/admin/dashboard/visibility", {
            method: "PUT",
            body: JSON.stringify({ components }),
          });
          components = body.components;
          render();
          setStatus("Saved dashboard visibility.");
        } catch (error) {
          setStatus(error.message, true);
        }
      });

      render();
    </script>
  </body>
</html>
